name: Firebase migration checks

on:
  push:
    branches: [firebase-migration]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JSON files
        run: |
          node -e "JSON.parse(require('fs').readFileSync('firebase.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('.firebaserc','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('firebase/functions/package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('firebase/firestore.indexes.json','utf8'))"

      - name: Check frontend JavaScript syntax
        run: |
          for f in public/*.js; do node --check "$f"; done

      - name: Check Firebase Functions syntax
        run: |
          node --check firebase/functions/index.js
          for f in firebase/functions/lib/*.js; do node --check "$f"; done

      - name: Verify no Hatchable runtime dependency remains in frontend
        run: |
          if grep -RniE "hatchable|__HATCHABLE__|/api/hero-image" public; then
            echo "Legacy Hatchable reference found in frontend."
            exit 1
          fi
