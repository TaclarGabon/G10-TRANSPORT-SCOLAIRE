.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px}.check{border:1px solid var(--line);border-radius:9px;padding:9px}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:7px}.kpi b{font-size:20px}.kpi span{display:block;font-size:9px;color:#6e8194}

.hero:before,.hero:after{content:"";position:absolute;z-index:2;pointer-events:none;border-radius:50%;left:73%;top:58%;opacity:0;transform:translate(-50%,-50%) scale(.2);border:2px solid rgba(255,255,255,.62);box-shadow:0 0 0 9px rgba(18,61,120,.07)}.hero:after{width:118px;height:118px;border-color:rgba(255,210,63,.42)}.hero:before{width:74px;height:74px}.hero.wave:before{animation:ripple 1.12s ease-out}.hero.wave:after{animation:ripple 1.28s ease-out .12s}.hero.wave img{animation:photoWave 1.15s ease-out}.welcome.wave h1{animation:titleWave .78s ease-out}.flag.wave i{animation:flagReveal .75s ease-out both}.flag.wave .y{animation-delay:.08s}.flag.wave .bb{animation-delay:.16s}

/* V1.17 — GRAND TITRE D'ESPACE + DECONNEXION FONCTIONNELLE */
.space-titlebar{
  margin:0 0 7px;
  min-height:48px;
  background:linear-gradient(90deg,#083d78,#0b5ca8);
  color:#fff;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:8px 10px 8px 14px;
  box-shadow:0 5px 16px rgba(8,61,120,.16)
}
.space-title-left{min-width:0}
.space-title-kicker{
  font-size:9px;
  font-weight:900;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:#bbd8f7;
  margin-bottom:2px
}
.space-title-text{
  font-size:17px;
  line-height:1.1;
  font-weight:950;
  color:#fff;
  white-space:normal
}
.space-logout{
  border:0;
  background:#ef4444;
  color:#fff;
  border-radius:9px;
  padding:8px 11px;
  font-size:10px;
  font-weight:950;
  white-space:nowrap;
  box-shadow:0 3px 9px rgba(120,20,20,.18)
}
.space-logout:active{transform:scale(.97)}
.top{
  margin-top:0;
  border-radius:10px;
}
.context-note{
  background:#fff;
  border:1px solid var(--line);
  border-radius:11px;
  padding:9px 11px;
  margin:8px 0 10px;
  font-size:10px;
  color:#63788b
}
@media(max-width:650px){
  .space-titlebar{min-height:44px;padding:7px 8px 7px 11px}
  .space-title-kicker{font-size:8px}
  .space-title-text{font-size:14px}
  .space-logout{font-size:9px;padding:7px 9px}
  .parent-row .badge{min-width:128px;font-size:11px;padding:9px 12px}
  .report-grid,.param-grid{grid-template-columns:1fr}
}


/* V1.19 — ORDRE ECOLES, RETOUR INVERSE, SUIVI LIVE, VRAIE DECONNEXION SIMULEE */
.space-actions{display:flex;gap:7px;align-items:center}
.space-home{
  border:1px solid rgba(255,255,255,.55);background:#fff;color:#0d4d8d;
  border-radius:9px;padding:8px 11px;font-size:10px;font-weight:950;white-space:nowrap
}
.school-editor{display:flex;flex-direction:column;gap:8px}
.school-row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;
  border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px}
.school-row.next-school{border:2px solid #ffd23f;background:#fffdf0;animation:nextPulse 1.1s ease-in-out infinite}
.route-section-title{font-size:13px;font-weight:950;color:#153a66;margin:5px 0 8px}
.route-section-sub{font-size:10px;color:#687d90;margin-bottom:8px}
.live-list{display:flex;flex-direction:column;gap:8px}
.live-row{display:grid;grid-template-columns:38px minmax(0,1fr) 150px;gap:10px;align-items:center;
  border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}
.live-row.next-live{border:2px solid #ffd23f;background:#fffdf0}
.live-status{min-width:135px;text-align:center;padding:9px 11px!important;font-size:11px!important}
.absent-row{opacity:.68;background:#fff5f5}
.logout-screen{
  min-height:100vh;max-width:none!important;display:none;place-items:center;padding:20px;background:#eef4fb
}
.logout-screen.active{display:grid}
.logout-card{width:min(430px,92vw);background:#fff;border:1px solid var(--line);border-radius:18px;
  padding:28px;text-align:center;box-shadow:0 16px 50px rgba(20,55,90,.12)}
.logout-card h2{margin:0 0 7px;color:#153a66}.logout-card p{font-size:12px;color:#6a7f91}
.criteria{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.criteria .quality-item strong{color:#153a66}
@media(max-width:650px){
  .space-actions{width:100%;justify-content:flex-end}
  .space-home,.space-logout{font-size:9px;padding:7px 9px}
  .live-row{grid-template-columns:32px minmax(0,1fr) 112px}
  .live-status{min-width:105px;font-size:10px!important;padding:8px!important}
}


/* V1.20 — CARTOGRAPHIE REELLE DE REFERENCE + SIMULATION FINALE */
.map-reference{
  position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;
  overflow:hidden;margin-top:10px
}
.map-reference img{display:block;width:100%;height:auto}
.map-caption{padding:8px 10px;font-size:10px;color:#62798d;border-top:1px solid var(--line);background:#fff}
.map-overlay{position:absolute;inset:0;pointer-events:none}
.map-person{
  position:absolute;transform:translate(-50%,-50%);background:#fff;color:#123d78;
  border:2px solid #176fd1;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:950;
  box-shadow:0 4px 10px rgba(20,60,100,.18);white-space:nowrap
}
.map-person.done{border-color:#17a663;color:#0b7b46;background:#ecfaf2}
.map-person.absent{border-color:#ef4444;color:#a52222;background:#fff1f1}
.map-person.next{border-color:#ffd23f;color:#765800;background:#fffbe6;animation:nextPulse 1.1s infinite}
.map-bus{
  position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;background:#123d78;color:#fff;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.22)
}
.map-tools{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
.map-tools .btn{font-size:10px}
.map-approx{background:#eef8ff;color:#155d99;border:1px solid #cfe4f6}
.map-warning{font-size:9px;color:#7a6500;background:#fff9db;border:1px solid #f1dd8e;padding:7px 9px;border-radius:9px;margin-top:7px}
.return-school-list{display:flex;flex-direction:column;gap:8px}
.return-school-row{display:grid;grid-template-columns:38px minmax(0,1fr) 90px;gap:8px;align-items:center;
  padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff}
.return-school-row.next-stop{border:2px solid #ffd23f}
.message-note{font-size:10px;color:#5e7488;background:#f5f9fd;border:1px solid #dce9f5;padding:9px 10px;border-radius:10px;margin-bottom:9px}
.readonly-chip{display:inline-block;background:#e9f1fb;color:#164f87;border-radius:99px;padding:4px 8px;font-size:9px;font-weight:900}
.badge-option{background:#eef3f8;color:#4e6478;border:1px solid #d7e1eb;border-radius:9px;padding:8px 10px;font-size:10px;margin:8px 0}
.loc-cell{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.loc-chip{display:inline-block;padding:3px 6px;border-radius:99px;background:#eef8ff;color:#155d99;font-size:8px;font-weight:900}
.route-mode{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.route-mode .card{margin:0}
@media(max-width:650px){
  .route-mode{grid-template-columns:1fr}
  .map-person{font-size:8px;padding:4px 6px}
  .map-bus{width:26px;height:26px;font-size:12px}
}


/* V1.20.1 — SUIVI PARENTS INSPIRE DES BONNES PRATIQUES DE TRACKING */
.map-bus{
  width:21px!important;height:21px!important;font-size:8px!important;
  letter-spacing:-.02em;border:2px solid #fff;
  box-shadow:0 3px 10px rgba(0,0,0,.28),0 0 0 3px rgba(18,61,120,.10)
}
.active-leg{
  stroke:#ffd23f;stroke-width:1.7;stroke-linecap:round;fill:none;
  filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px #ffd23f);
  stroke-dasharray:3 2;animation:routeGlow 1.05s linear infinite
}
.active-leg-under{
  stroke:#0b5ca8;stroke-width:3.4;stroke-linecap:round;fill:none;opacity:.78
}
@keyframes routeGlow{to{stroke-dashoffset:-10}}
.parent-track-card{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0
}
.parent-track-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.parent-track-title{font-size:14px;font-weight:950;color:#153a66}
.parent-track-state{font-size:10px;color:#61778b;margin-top:3px}
.parent-track-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.parent-track-box{border:1px solid #e2eaf2;background:#f8fbfe;border-radius:10px;padding:9px}
.parent-track-box b{display:block;color:#153a66;font-size:12px}
.parent-track-box span{display:block;color:#6a7f91;font-size:9px;margin-top:2px}
.tracking-disclaimer{
  font-size:9px;color:#6c7f90;background:#f3f7fb;border-radius:9px;padding:7px 9px;margin-top:8px
}
.approach-pill{
  display:inline-block;background:#fff6c8;color:#735500;border:1px solid #eed15b;
  border-radius:999px;padding:5px 8px;font-size:9px;font-weight:950
}
@media(max-width:650px){
  .parent-track-grid{grid-template-columns:1fr}
}


/* V1.20.2 — DIRECTION / RECETTES MENSUELLES */
.dir-monthbar{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0 10px
}
.dir-monthbar b{color:#153a66}.dir-monthbar span{font-size:10px;color:#667b8d}
.dir-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:9px 0}
.dir-kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;min-height:88px}
.dir-kpi .v{font-size:22px;font-weight:950;color:#153a66}.dir-kpi .l{font-size:10px;color:#6c8092;margin-top:4px}
.dir-kpi.greenish{background:#effaf4}.dir-kpi.blueish{background:#eef6ff}.dir-kpi.redish{background:#fff1f1}.dir-kpi.yellowish{background:#fff7dc}
.dir-grid{display:grid;grid-template-columns:1fr 1.15fr;gap:10px}
.dir-panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}
.dir-panel h3{margin:0 0 10px;color:#153a66;font-size:14px}
.donut-wrap{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center}

function uniqueSchools(){
  var seen={}, out=[];
  st.subs.forEach(function(x){if(x.school&&!seen[x.school]){seen[x.school]=1;out.push(x.school)}});
  return out
}
function syncSchoolOrder(){
  var available=uniqueSchools();
  /* Ordre final validé sur la carte fournie : Madonne → Quaben → Bessieux → Prytanée militaire. */
  var preferred=["Madonne","Quaben","Bessieux","Prytanée militaire"];
  var proposed=preferred.filter(function(s){return available.indexOf(s)>=0});
  available.forEach(function(s){if(proposed.indexOf(s)<0)proposed.push(s)});
  if(st.mapRevision!=="V1.21.2-MAPS"){
    st.schoolOrder=proposed.slice();
    st.mapRevision="V1.21.2-MAPS";
  }else if(!Array.isArray(st.schoolOrder)||!st.schoolOrder.length)st.schoolOrder=proposed.slice();
  else{
    st.schoolOrder=st.schoolOrder.filter(function(s){return available.indexOf(s)>=0});
    proposed.forEach(function(s){if(st.schoolOrder.indexOf(s)<0)st.schoolOrder.push(s)});
  }
  save()
}
function orderedSchools(activeOnly){
  syncSchoolOrder();
  if(!activeOnly)return st.schoolOrder.slice();
  var mountedSchools={};
  /* Le circuit visuel conserve aussi l'établissement de l'enfant déposé le matin par sa mère,
     afin que les 4 établissements restent cohérents avec la carte validée. */
  st.subs.forEach(function(x){if(x.ride==='Monté'||x.noMorning)mountedSchools[x.school]=1});
  return st.schoolOrder.filter(function(s){return mountedSchools[s]})
}
function nextSchoolIndex(){
  var schools=orderedSchools(true);
  for(var i=0;i<schools.length;i++){if(!st.schools[schools[i]])return i}
  return -1
}
function schoolOrderEditor(){
  syncSchoolOrder();
  return '<div class="route-section-title">2. Ordre des établissements</div><div class="route-section-sub">L’administration choisit l’ordre des écoles. Le chauffeur suit cet ordre sans le modifier.</div><div class="school-editor">'+
  st.schoolOrder.map(function(s,i){return '<div class="school-row"><div class="num">'+(i+1)+'</div><div><b>'+s+'</b><div class="small">'+st.subs.filter(function(x){return x.school===s}).length+' enfant(s)</div></div><div class="route-tools"><button '+(i===0?'disabled':'')+' onclick="moveSchoolIndex('+i+',-1)">↑</button><button '+(i===st.schoolOrder.length-1?'disabled':'')+' onclick="moveSchoolIndex('+i+',1)">↓</button></div></div>'}).join('')+'</div>'
}
function moveSchoolIndex(i,dir){
  syncSchoolOrder();
  var j=i+dir;
  if(i<0||j<0||i>=st.schoolOrder.length||j>=st.schoolOrder.length)return;
  var tmp=st.schoolOrder[i];st.schoolOrder[i]=st.schoolOrder[j];st.schoolOrder[j]=tmp;
  save();adminTab('circuit')
}
function liveStatus(x){
  if(x.ret==='Déposé retour')return ['Déposé(e)','ok'];
  if(x.ret==='Récupéré')return ['Retour maison','mounted'];
  if(st.schools[x.school])return ['Arrivé(e) école','done'];
  if(x.ride==='Absent')return ['Absent','bad'];
  if(x.ride==='Monté')return ['Monté(e)','ok'];
  return ['À prendre','wait']
}
function gestionLiveList(){
  var next=nextPickupIndex();
  return '<div class="live-list">'+st.subs.map(function(x,i){
    var s=liveStatus(x),extra=(i===next&&x.ride==='À prendre')?' next-live':'',abs=x.ride==='Absent'?' absent-row':'';
    return '<div class="live-row'+extra+abs+'"><div class="num">'+(i+1)+'</div><div><b>'+x.name+'</b><div class="small">'+x.pickup+' → '+x.school+'</div>'+(i===next&&x.ride==='À prendre'?'<span class="next-label">Prochain à récupérer</span>':'')+'</div><span class="badge live-status '+s[1]+'">'+s[0]+'</span></div>'

var PLACE_ORDER=["Premier Campement","Akanda","Avorbam","Première Cité","Okala","Alibandeng"];
var PLACE_POS={
  "Premier Campement":[12,12],
  "Akanda":[19,20],
  "Avorbam":[21,25],
  "Première Cité":[28,34],
  "Okala":[32,42],
  "Alibandeng":[39,66]
};

/* Positions visuelles finales basées sur la carte fournie par l'utilisateur.
   Les deux enfants d'Alibandeng ont volontairement deux positions distinctes. */
var CHILD_MAP_POS={
  "1":[26.5,32.8],  /* LEHOUMA — Première cité */
  "2":[10.3,8.8],   /* Yatina — Premier campement */
  "3":[52.8,62.8],  /* Siby — Alibandeng, écartée pour lisibilité */
  "4":[40.7,67.0]   /* ENGO — Alibandeng */
};
var CHILD_MAP_PLACE={
  "1":"Première cité",
  "2":"Premier campement",
  "3":"Alibandeng",
  "4":"Alibandeng"
};
function childMapPosition(x){
  return CHILD_MAP_POS[String(x.id)] || PLACE_POS[x.approxPlace||guessPlace(x)] || PLACE_POS["Akanda"];
}
function childMapPlaceLabel(x){
  return CHILD_MAP_PLACE[String(x.id)] || (x.approxPlace||guessPlace(x)||"");
}
function pickupBusPosition(next){
  if(!next)return [40.7,67.0];
  var p=childMapPosition(next);
  if(String(next.id)==="2")return [6.2,5.8];
  return [Math.max(3,p[0]-3.2),Math.max(3,p[1]-3.2)];
}
function pickupRouteSvg(){
  var active=st.subs.filter(function(x){return !x.noMorning});
  if(!active.length)return "";
  var pts=[[6.2,5.8]].concat(active.map(function(x){return childMapPosition(x)}));
  var path="M "+pts.map(function(p){return p[0]+" "+p[1]}).join(" L ");
  var handled=active.filter(function(x){return x.ride==="Monté"||x.ride==="Absent"}).length;
  var donePts=pts.slice(0,Math.min(handled+1,pts.length));
  var donePath=donePts.length>1?("M "+donePts.map(function(p){return p[0]+" "+p[1]}).join(" L ")):"";
  var currentPath="";
  if(handled<active.length){
    var a=pts[handled],b=pts[handled+1];
    currentPath="M "+a[0]+" "+a[1]+" L "+b[0]+" "+b[1];
  }
  return '<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:2">'+
    '<path class="pickup-route-base" d="'+path+'"></path>'+
    (donePath?'<path class="pickup-route-done" d="'+donePath+'"></path>':'')+
    (currentPath?'<path class="pickup-route-current" d="'+currentPath+'"></path>':'')+
  '</svg>';
}

function simpleText(v){return String(v||"").replace(/[\/;|—–-]+/g," ").replace(/\s+/g," ").trim()}
function guessPlace(x){
  var t=(x.pickup+" "+x.address+" "+x.district+" "+x.commune).toLowerCase();
  if(t.indexOf("premier campement")>=0)return "Premier Campement";
  if(t.indexOf("avorobam")>=0||t.indexOf("avorbam")>=0)return "Avorbam";
  if(t.indexOf("première cité")>=0||t.indexOf("premiere cite")>=0||t.indexOf("1er cité")>=0||t.indexOf("1er cite")>=0)return "Première Cité";
  if(t.indexOf("okala")>=0)return "Okala";
  if(t.indexOf("aliband")>=0)return "Alibandeng";
  if(t.indexOf("akanda")>=0)return "Akanda";
  return "Akanda";
}

var APPROX_COORDS={
  "Premier Campement":[0.52838,9.36920],
  "Akanda":[0.51642,9.38822],
  "Avorbam":[0.50914,9.39036],
  "Première Cité":[0.49766,9.40239],
  "Okala":[0.48692,9.40942],
  "Alibandeng":[0.45590,9.42752]
};
function coordText(place){
  var c=APPROX_COORDS[place];
  return c?(c[0].toFixed(5)+", "+c[1].toFixed(5)):"Coordonnées à confirmer"
}

function approxChildIndex(i){
  if(i<0||i>=st.subs.length)return;
  var x=st.subs[i],p=guessPlace(x);
  x.approxPlace=p;x.mapApprox=true;x.approxCoord=APPROX_COORDS[p]||null;
  st.locationFeedback=x.name+" : position approximative proposée — "+p+" ≈ "+coordText(p)+". Référence croisée MapCarta + Google Maps déjà validée dans la simulation.";
  log(x.name+" : localisation approximative → "+p);save();adminTab('abonnes')
}
function approxAll(){
  st.subs.forEach(function(x){x.approxPlace=guessPlace(x);x.mapApprox=true;x.approxCoord=APPROX_COORDS[x.approxPlace]||null});
  st.locationFeedback="Localisation approximative calculée pour tous les abonnés à partir des références MapCarta + Google Maps déjà croisées.";
  log("Positions approximatives recalculées");save();adminTab('circuit')
}
function redefineRoute(){
  st.subs.forEach(function(x){x.approxPlace=x.approxPlace||guessPlace(x);x.mapApprox=true;x.approxCoord=APPROX_COORDS[x.approxPlace]||null});
  st.subs.sort(function(a,b){
    var ia=PLACE_ORDER.indexOf(a.approxPlace),ib=PLACE_ORDER.indexOf(b.approxPlace);
    return (ia<0?99:ia)-(ib<0?99:ib)
  });
  st.locationFeedback="Nouvelle proposition de ramassage générée selon l’ordre géographique approximatif : "+st.subs.map(function(x){return x.approxPlace}).join(" → ");
  log("Trajet de ramassage reproposé");save();adminTab('circuit')
}
function nextMapChild(){
  var i=nextPickupIndex();return i>=0?st.subs[i]:null
}

function handledPickupIndex(){
  var last=-1;
  for(var i=0;i<st.subs.length;i++){
    if(st.subs[i].ride==='Monté'||st.subs[i].ride==='Absent') last=i;
    else break;
  }
  return last
}
function activeLegSvg(){
  var next=nextMapChild(); if(!next)return '';
  var ni=st.subs.findIndex(function(x){return x.id===next.id});
  var li=handledPickupIndex();
  var startPlace=li>=0?(st.subs[li].approxPlace||guessPlace(st.subs[li])):"Akanda";
  var endPlace=next.approxPlace||guessPlace(next);
  var a=PLACE_POS[startPlace]||PLACE_POS["Akanda"], b=PLACE_POS[endPlace]||PLACE_POS["Akanda"];
  return '<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible">'+
    '<line class="active-leg-under" x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'"></line>'+
    '<line class="active-leg" x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'"></line>'+
  '</svg>'
}
function lastMovementText(){
  if(!st.log||!st.log.length)return 'Aucun mouvement enregistré';
  return st.log[st.log.length-1]
}
function parentTrackingSummary(x){
  var next=nextMapChild(), state='Circuit en attente', target='—';
  if(st.route){
    if(x.ret==='Déposé retour'){state='Enfant déposé(e)';target='Trajet terminé'}
    else if(x.ret==='Récupéré'){state='Retour en cours';target=x.drop||'Domicile / relais'}
    else if(st.schools[x.school]){state='Arrivé(e) à l’école';target=x.school}

<script id="v1216-flow-logic">
(function(){
  function localDayKey(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  window.localDayKey=localDayKey;
  st.archives=Array.isArray(st.archives)?st.archives:[];
  st.workDate=st.workDate||localDayKey();
  st.morningClosed=!!st.morningClosed;
  st.returnStarted=!!st.returnStarted;
  st.dayClosed=!!st.dayClosed;
  st.dayPhase=st.dayPhase||(st.dayClosed?'closed':st.returnStarted?'return':st.morningClosed?'morning_closed':st.route?'morning':'prestart');
  if(st.absenceSchema!=='declared-v1'){
    st.subs.forEach(function(x){
      x.absentMorning=false;x.absentReturn=false;x.absentMorningSource='';x.absentReturnSource='';
      if(x.ride==='Absent')x.ride='À prendre';
      if(x.ret==='Absent retour')x.ret='À récupérer';
    });
    st.absenceSchema='declared-v1';
  }else{
    st.subs.forEach(function(x){
      if(x.absentMorning===undefined)x.absentMorning=false;
      if(x.absentReturn===undefined)x.absentReturn=false;
      if(x.absentMorning&&x.ride!=='Monté')x.ride='Absent';
      if(x.absentReturn&&x.ret!=='Récupéré'&&x.ret!=='Déposé retour')x.ret='Absent retour';
    });
  }
  if(st.workDate!==localDayKey()){
    resetForNewOperationalDay('Changement automatique de date');
  }
  save();
})();

function archiveOperationalDay(reason){
  st.archives=Array.isArray(st.archives)?st.archives:[];
  st.archives.push({date:st.workDate||localDayKey(),closedAt:new Date().toLocaleString('fr-FR'),reason:reason||'Clôture',log:(st.log||[]).slice(),events:(st.events||[]).slice(),subs:st.subs.map(function(x){return {id:x.id,name:x.name,ride:x.ride,ret:x.ret,absentMorning:!!x.absentMorning,absentReturn:!!x.absentReturn}})});
  if(st.archives.length>31)st.archives=st.archives.slice(-31)
}
function clearDailyOperationalFields(){
  st.route=false;st.checks={};st.schools={};st.returnSchools={};st.events=[];st.log=[];st.morningClosed=false;st.returnStarted=false;
  st.subs.forEach(function(x){x.ride='À prendre';x.ret='À récupérer';x.absentMorning=false;x.absentReturn=false;x.absentMorningSource='';x.absentReturnSource=''});
}
function resetForNewOperationalDay(reason){
  if(st.workDate&&((st.log||[]).length||(st.events||[]).length||st.morningClosed||st.returnStarted||st.route))archiveOperationalDay(reason||'Nouveau jour');
  clearDailyOperationalFields();st.dayClosed=false;st.dayPhase='prestart';st.workDate=localDayKey();save()
}
function ensureOperationalDay(){if(st.workDate!==localDayKey())resetForNewOperationalDay('Nouveau jour détecté')}
function phaseLabel(){
  if(st.dayClosed)return 'Journée clôturée';
  if(st.returnStarted)return 'Circuit retour en cours';
  if(st.morningClosed)return 'Circuit du matin terminé';
  if(st.route)return 'Circuit du matin en cours';
  return 'En attente de départ'
}
function badgeClass(v){return v==='Payé'||v==='Déposé'||v==='Déposé retour'||v==='Monté'||v==='Récupéré'?'ok':(v==='Absent'||v==='Absent retour'||v==='Non payé'?'bad':'wait')}

function canEditMorningAbsence(x){return !st.morningClosed&&!st.dayClosed&&x.ride!=='Monté'&&!st.schools[x.school]}
function canEditReturnAbsence(x){return !st.dayClosed&&x.ret!=='Récupéré'&&x.ret!=='Déposé retour'}
function setDailyAbsence(id,leg,isAbsent,source){
  ensureOperationalDay();
  var x=st.subs.find(function(s){return s.id===id});if(!x)return;
  source=source||'Administration';
  if(leg==='morning'){
    if(x.noMorning){alert(x.name+' n’a pas de ramassage le matin. Utilisez plutôt l’absence retour si nécessaire.');return}
    if(!canEditMorningAbsence(x)){alert('Le statut du matin de '+x.name+' est déjà verrouillé par le circuit.');return}
    x.absentMorning=!!isAbsent;x.absentMorningSource=isAbsent?source:'';x.ride=isAbsent?'Absent':'À prendre';
    childEvent(x.id,isAbsent?'Absence du matin déclarée par '+source:'Absence du matin annulée par '+source);
    log(x.name+' : '+(isAbsent?'absent(e) le matin':'présent(e) le matin')+' — '+source)
  }else{
    if(!canEditReturnAbsence(x)){alert('Le statut retour de '+x.name+' est déjà verrouillé par le circuit.');return}
    x.absentReturn=!!isAbsent;x.absentReturnSource=isAbsent?source:'';x.ret=isAbsent?'Absent retour':'À récupérer';
    childEvent(x.id,isAbsent?'Absence du retour déclarée par '+source:'Absence du retour annulée par '+source);
    log(x.name+' : '+(isAbsent?'absent(e) au retour':'présent(e) au retour')+' — '+source)
  }
  syncReturnSchools();save()
}
function absenceButtonHtml(x,leg,source){
  var morning=leg==='morning',abs=morning?!!x.absentMorning:!!x.absentReturn;
  var locked=morning?!canEditMorningAbsence(x):!canEditReturnAbsence(x);
  if(morning&&x.noMorning)return '<div class="absence-control"><span class="label">Matin</span><button class="absence-btn" disabled>Pas de ramassage</button></div>';
  return '<div class="absence-control"><span class="label">'+(morning?'Matin':'Retour')+'</span><button class="absence-btn '+(abs?'on':'present')+'" '+(locked?'disabled':'')+' onclick="setDailyAbsence(\''+x.id+'\',\''+leg+'\','+(!abs)+',\''+source+'\');'+(source==='Parent'?'parentTab(\'enfant\')':'adminTab(\'circuit\')')+'">'+(abs?'Absent — modifier':'Présent — signaler absent')+'</button></div>'
}
function absenceAdminPanel(){
  return '<div class="absence-panel"><h3>Absences du jour</h3><div class="intro">L’Administration peut déclarer une absence <b>matin</b> ou <b>retour</b>. Le chauffeur voit immédiatement le statut et ne doit pas déclarer lui-même une absence en sautant un enfant.</div><div class="absence-list">'+st.subs.map(function(x){return '<div class="absence-row"><div class="absence-child"><b>'+x.name+'</b><span>'+x.school+'</span></div>'+absenceButtonHtml(x,'morning','Administration')+absenceButtonHtml(x,'return','Administration')+'</div>'}).join('')+'</div></div>'
}
function absenceParentPanel(x){
  return '<div class="absence-panel"><h3>Signaler une absence</h3><div class="intro">Déclarez uniquement l’absence de votre enfant pour le <b>matin</b> ou le <b>retour</b>. Une étape déjà validée par le chauffeur est verrouillée.</div><div class="absence-row"><div class="absence-child"><b>'+x.name+'</b><span>'+x.school+'</span></div>'+absenceButtonHtml(x,'morning','Parent')+absenceButtonHtml(x,'return','Parent')+'</div></div>'
}

var _adminTabV1215=adminTab;
adminTab=function(t){
  ensureOperationalDay();
  _adminTabV1215(t);
  if(t==='circuit'){
    var b=document.getElementById('adminBody');
    if(b)b.innerHTML=sectionHeader('Administration','Création du circuit','Déterminer l’ordre des enfants à ramasser avec le chauffeur et déclarer les absences du jour.')+absenceAdminPanel()+routeEditor()
  }
};

parentView=function(x){
  return '<div class="card"><h2>'+x.name+'</h2><p>'+x.school+'</p></div>'+absenceParentPanel(x)+parentTrackingSummary(x)+ramassageMapHtml('parent')+'<div class="parent-flow"><div class="parent-row"><div>Circuit</div><span class="badge '+(st.route?'ok':'wait')+'">'+phaseLabel()+'</span></div><div class="parent-row"><div>Matin</div><span class="badge '+(x.ride==='Monté'?'ok':x.ride==='Absent'?'bad':'wait')+'">'+(x.noMorning?'Pas de ramassage':x.ride)+'</span></div><div class="parent-row"><div>Arrivé à l’école</div><span class="badge '+(st.schools[x.school]?'ok':'wait')+'">'+(st.schools[x.school]?'Déposé(e)':'En attente')+'</span></div><div class="parent-row"><div>Retour</div><span class="badge '+(x.ret==='Récupéré'||x.ret==='Déposé retour'?'ok':x.ret==='Absent retour'?'bad':'wait')+'">'+(x.ret==='Absent retour'?'Absent retour':x.ret==='Déposé retour'?'Arrivé(e)':x.ret==='Récupéré'?'En route':'À récupérer')+'</span></div></div>'
};

function allMorningPickupsHandled(){return st.subs.filter(function(x){return !x.noMorning}).every(function(x){return x.ride==='Monté'||x.ride==='Absent'})}
function allMorningSchoolsDone(){var a=orderedSchools(true);return !!a.length&&a.every(function(s){return !!st.schools[s]})}
function canCloseMorning(){return allMorningPickupsHandled()&&allMorningSchoolsDone()}
function closeMorningCircuit(){
  if(st.morningClosed)return;
  if(!canCloseMorning()){alert('Le circuit du matin ne peut pas être clôturé : toutes les montées/absences déclarées et toutes les déposes école doivent être validées.');return}
  st.morningClosed=true;st.returnStarted=false;st.route=false;st.dayPhase='morning_closed';
  log('Circuit du matin clôturé');save();driverTab('retour')
}
function startReturnCircuit(){
  if(!st.morningClosed){alert('Clôturez d’abord le circuit du matin.');return}
  if(st.dayClosed){alert('La journée est déjà clôturée.');return}
  st.returnStarted=true;st.route=true;st.dayPhase='return';log('Circuit retour démarré');save();driverTab('retour')
}
function allReturnHandled(){return st.subs.every(function(x){return x.absentReturn||x.ret==='Déposé retour'})}
function closeDriverDay(){
  if(!allReturnHandled()){alert('La journée ne peut pas être clôturée : certains enfants ne sont pas encore déposés ou déclarés absents au retour.');return}
  log('Journée chauffeur clôturée');save();archiveOperationalDay('Clôture chauffeur');
  st.route=false;st.checks={};st.schools={};st.returnSchools={};st.events=[];st.log=[];st.morningClosed=false;st.returnStarted=false;st.dayClosed=true;st.dayPhase='closed';
  st.subs.forEach(function(x){x.ride='À prendre';x.ret='À récupérer';x.absentMorning=false;x.absentReturn=false;x.absentMorningSource='';x.absentReturnSource=''});
  save();signOut()
}

startRoute=function(){
  ensureOperationalDay();
  if(st.dayClosed){alert('La journée est clôturée. Le prochain circuit sera disponible au nouveau jour ou après Réinitialiser la simulation.');return}
  if(st.dayPhase!=='prestart'){alert('Le circuit a déjà été démarré ou clôturé. Les étapes déjà validées restent verrouillées.');return}
  if(!checkNames.every(function(c){return !!st.checks[c]})){alert('Validez d’abord tous les points du contrôle 360°.');return}
  st.route=true;st.dayPhase='morning';st.driver.controls360=(st.driver.controls360||0)+1;
  if(st.drivers&&st.drivers[0])st.drivers[0].controls360=st.driver.controls360;
  save();log('Circuit AKANDA-01 démarré');driverTab('montees')
};

function rows(kind){
  var nextIdx=nextPickupIndex(),active=st.subs.filter(function(x){return !x.noMorning}),noMorning=st.subs.filter(function(x){return x.noMorning}),arr=active.concat(noMorning);
  return '<div class="notice" style="margin-bottom:8px"><b>'+st.subs.length+' abonnés affichés</b> • '+active.length+' ramassage(s) le matin. Une absence doit être déclarée par le Parent ou l’Administration ; le chauffeur ne peut pas créer une absence en sautant une ligne.</div><div class="list">'+arr.map(function(x){
    var i=st.subs.findIndex(function(s){return s.id===x.id});
    if(x.noMorning)return '<div class="row done-row"><div class="num">'+(arr.indexOf(x)+1)+'</div><div><b>'+x.name+'</b><div class="small">Pas de ramassage matin — déposé à l’école par sa mère</div></div><button class="status stwait" disabled>Pas de ramassage</button></div>';
    var val=x.ride,cls=val==='Monté'?'mounted':val==='Absent'?'absent':'stwait',isNext=i===nextIdx,rowClass=(val==='Monté'||val==='Absent')?' done-row':(isNext?' next-stop':'');
    var locked=st.morningClosed||st.dayClosed||val==='Monté'||val==='Absent'||!st.route;
    return '<div class="row'+rowClass+'"><div class="num">'+(arr.indexOf(x)+1)+'</div><div><b>'+x.name+'</b><div class="small">'+x.pickup+'</div>'+(isNext&&val==='À prendre'?'<span class="next-label">Prochain à récupérer</span>':'')+(val==='Absent'?'<div class="small" style="color:#a33">Absent déclaré'+(x.absentMorningSource?' par '+x.absentMorningSource:'')+'</div>':'')+'</div><button class="status '+cls+'" '+(locked?'disabled':'')+' onclick="rideIndexById(\''+x.id+'\')">'+val+'</button></div>'
  }).join('')+'</div>'
}

ride=function(id){
  ensureOperationalDay();
  var x=st.subs.find(function(s){return s.id===id});if(!x)return;
  if(st.morningClosed||st.dayPhase!=='morning'){alert('Les montées du matin sont verrouillées pour cette étape de la journée.');return}
  if(x.noMorning){alert('Information : '+x.name+' n’a pas de ramassage le matin.');return}
  if(x.absentMorning||x.ride==='Absent'){alert(x.name+' est déclaré(e) absent(e) le matin. Le chauffeur n’a rien à valider.');return}
  if(x.ride==='Monté'){alert('La montée de '+x.name+' est déjà validée et ne peut plus être modifiée.');return}
  var active=st.subs.filter(function(s){return !s.noMorning}),targetPos=active.findIndex(function(s){return s.id===id});
  if(targetPos>0){var missed=active.slice(0,targetPos).find(function(s){return s.ride!=='Monté'&&s.ride!=='Absent'});if(missed){alert('ATTENTION : '+missed.name+' n’a pas encore été récupéré(e). S’il/elle est réellement absent(e), le Parent ou l’Administration doit d’abord déclarer l’absence.');driverTab('montees');return}}
  x.ride='Monté';childEvent(x.id,'Enfant monté(e) dans le bus');save();log(x.name+' : montée validée');
  if(allMorningPickupsHandled())driverTab('ecoles');else driverTab('montees')
};

school=function(s){
  ensureOperationalDay();
  if(st.morningClosed){alert('Le circuit du matin est clôturé. Les déposes école sont en lecture seule.');return}
  if(!allMorningPickupsHandled()){alert('Impossible de valider une école : un enfant du ramassage du matin n’a pas encore été récupéré. S’il est absent, l’absence doit être déclarée par le Parent ou l’Administration.');return}
  if(st.schools[s]){alert(s+' est déjà validé(e) comme déposé(e). Cette étape est verrouillée.');return}
  var arr=orderedSchools(true),next=nextSchoolIndex(),idx=arr.indexOf(s);
  if(idx!==next){var expected=arr[next];alert('Respectez l’ordre des établissements. Prochain établissement : '+(expected||'—'));return}
  st.schools[s]=true;st.subs.filter(function(x){return x.school===s&&x.ride==='Monté'}).forEach(function(x){childEvent(x.id,'Arrivé(e) et déposé(e) à '+s)});
  save();log(s+' : dépose validée');driverTab('ecoles')
};

function schoolStatusRecovered(s){
  var kids=st.subs.filter(function(x){return x.school===s});
  return kids.length>0&&kids.every(function(x){return x.absentReturn||x.ret!=='À récupérer'})
}
function syncReturnSchools(){orderedSchools(false).forEach(function(s){st.returnSchools=st.returnSchools||{};st.returnSchools[s]=schoolStatusRecovered(s)})}
function schoolExitTime(s){var times=st.subs.filter(function(x){return x.school===s&&!x.absentReturn}).map(function(x){return x.exit||'23:59'});return times.length?times.sort()[0]:'—'}
function returnSchoolOrder(){syncSchoolOrder();var relevant={};st.subs.forEach(function(x){if(!x.absentReturn)relevant[x.school]=1});return st.schoolOrder.filter(function(s){return relevant[s]})}
function returnSchoolsHtml(){
  syncReturnSchools();var arr=returnSchoolOrder();if(!arr.length)return '<div class="notice">Aucun établissement actif pour le retour.</div>';
  return '<div class="return-school-list">'+arr.map(function(s,i){var done=!!st.returnSchools[s];return '<div class="return-school-row '+(done?'done-row':'')+'"><div class="num">'+(i+1)+'</div><div><b>'+s+'</b><div class="small">Sortie prévue : '+schoolExitTime(s)+'</div></div><span class="badge '+(done?'ok':'wait')+'">'+(done?'Récupéré':'À récupérer')+'</span></div>'}).join('')+'</div>'
}
function returnRows(){
  var arr=st.subs.slice();if(!arr.length)return '<div class="notice">Aucun enfant à gérer au retour.</div>';
  return '<div class="list">'+arr.map(function(x,i){
    if(x.absentReturn||x.ret==='Absent retour')return '<div class="row absent-row"><div class="num">'+(i+1)+'</div><div><b>'+x.name+'</b><div class="small">'+x.school+' • absence retour déclarée'+(x.absentReturnSource?' par '+x.absentReturnSource:'')+'</div></div><button class="status absent" disabled>Absent retour</button></div>';
    var val=x.ret||'À récupérer',cls=val==='Récupéré'?'mounted':val==='Déposé retour'?'done':'stwait',locked=!st.returnStarted||st.dayClosed||val==='Déposé retour';
    return '<div class="row'+(val==='Déposé retour'?' done-row':'')+'"><div class="num">'+(i+1)+'</div><div><b>'+x.name+'</b><div class="small">'+x.school+' → '+x.drop+'</div></div><button class="status '+cls+'" '+(locked?'disabled':'')+' onclick="retReturnId(\''+x.id+'\')">'+val+'</button></div>'
  }).join('')+'</div>'
}
ret=function(id){
  ensureOperationalDay();var x=st.subs.find(function(s){return s.id===id});if(!x)return;
  if(!st.returnStarted){alert('Démarrez d’abord le circuit retour.');return}
  if(x.absentReturn){alert(x.name+' est déclaré(e) absent(e) au retour.');return}
  if(x.ret==='Déposé retour'){alert('Le retour de '+x.name+' est déjà terminé et verrouillé.');return}
  if(x.ret==='À récupérer'){x.ret='Récupéré';childEvent(x.id,'Enfant récupéré(e) à l’école pour le retour');log(x.name+' : récupéré(e) à l’école')}
  else if(x.ret==='Récupéré'){x.ret='Déposé retour';childEvent(x.id,'Enfant déposé(e) '+(x.dropType==='Relais'?'au point relais':'au domicile'));log(x.name+' : déposé(e) au retour')}
  syncReturnSchools();save();driverTab('retour')
};

function driverTab(t){
  ensureOperationalDay();updateSpaceTitle('driver',t);var b=document.getElementById('driverBody');if(!b)return;
  if(t==='circuit'){
    b.innerHTML=sectionHeader('Espace chauffeur','Circuit du jour','Bus AKANDA-01 • Les étapes validées restent enregistrées même après déconnexion.')+ramassageMapHtml('driver')+'<div class="status-grid"><div class="status-card"><b>'+phaseLabel()+'</b><span>État du service</span></div><div class="status-card"><b>'+doneCount()+'</b><span>Enfants déposés retour</span></div><div class="status-card"><b>'+st.subs.filter(function(x){return x.ride==='Monté'}).length+'</b><span>Montées validées</span></div><div class="status-card"><b>'+st.subs.filter(function(x){return x.ride==='Absent'}).length+'</b><span>Absences matin déclarées</span></div></div>'+(st.dayClosed?'<div class="day-closed-note">La journée est clôturée. Les données opérationnelles ont été archivées et le prochain jour repartira à zéro.</div>':'');return
  }
  if(t==='controle'){
    var locked=st.dayPhase!=='prestart'||st.dayClosed;

    (st.morningClosed?'<div class="shift-card"><strong>Circuit du matin clôturé</strong><div class="small">Toutes les informations du matin restent enregistrées. Vous pouvez vous déconnecter sans les perdre ou passer au retour.</div></div>':allDone?'<div class="shift-card"><strong>Toutes les déposes école sont terminées.</strong><div class="small">Clôturez maintenant le circuit du matin. Les données resteront conservées pour le retour.</div><div class="shift-actions"><button class="shift-btn morning" onclick="closeMorningCircuit()">Clôturer le circuit du matin</button></div></div>':'');return

saveEdit=function(id){
  var x=st.subs.find(function(s){return s.id===id});if(!x)return;
  var oldNoMorning=!!x.noMorning;
  ['name','school','guardian','whatsapp','commune','district','address','plan','pickupType','pickup','drop','entry','exit','emergency','emergencyPhone'].forEach(function(k){var e=document.getElementById('e_'+k);if(e)x[k]=e.value.trim()});
