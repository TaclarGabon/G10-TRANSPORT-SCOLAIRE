<head>

<title>G10 Transport Scolaire — V1.21 Après présentation</title>
<style>
:root{--b:#123d78;--bg:#eef4fb;--line:#dce6f0;--green:#17a663;--red:#ef4750;--orange:#ff812d;--purple:#7a42e6;--yellow:#ffc83d;--blue:#1676f3}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:#17324f}
button,input,select{font:inherit}.screen{display:none;padding:8px;max-width:1100px;margin:auto}.screen.active{display:block}
.hero{position:relative;border-radius:18px;overflow:hidden;background:#fff;aspect-ratio:2.18/1}
.hero img{display:block;width:100%;height:100%;object-fit:cover;object-position:center top}.zone{position:absolute;right:10px;top:10px;background:#ffd84a;padding:6px 10px;border-radius:99px;font-weight:900;font-size:11px;z-index:4}
.bottom-mask{display:none}
.welcome{text-align:center;padding:8px 4px}.welcome h1{margin:0;color:var(--b);font-size:19px}.welcome p{margin:4px 0;font-size:10px;color:#6b7f94;font-weight:800}.flag{display:flex;height:5px;width:75%;margin:7px auto;border-radius:9px;overflow:hidden}.flag i{flex:1}.g{background:#1fa85a}.y{background:#ffd23f}.bb{background:#123d78}
.sim{display:flex;justify-content:center;gap:7px;align-items:center;margin:5px 0}.badge{display:inline-block;border-radius:99px;padding:5px 8px;font-size:9px;font-weight:900}.simb{background:#fff2bf;color:#765800;border:1px solid #e6c34d}.ok{background:#dff7e8;color:#0b7b46}.wait{background:#fff1d8;color:#965f00}.bad{background:#ffe1e1;color:#ae2e2e}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:7px}.role{border:0;border-radius:17px;color:#fff;padding:13px 8px;min-height:78px;font-weight:850;opacity:1;transform:none;transition:transform .16s ease,filter .16s ease,box-shadow .16s ease}.role b{display:block;font-size:13px;letter-spacing:.01em}.role span{display:block;font-size:9px;margin-top:5px;font-weight:500;opacity:.94}.role:active{transform:scale(.975);filter:brightness(.97)}.role.tap{animation:tapPulse .32s ease}.home-animate .role{opacity:0;transform:translateY(12px);animation:roleIn .48s cubic-bezier(.2,.75,.2,1) forwards}.home-animate .role:nth-child(1){animation-delay:.10s}.home-animate .role:nth-child(2){animation-delay:.18s}.home-animate .role:nth-child(3){animation-delay:.26s}.home-animate .role:nth-child(4){animation-delay:.34s}.home-animate .role:nth-child(5){animation-delay:.42s}.home-animate .role:nth-child(6){animation-delay:.50s}
.student{background:var(--blue)}.parent{background:var(--purple)}.driver{background:var(--red)}.admin{background:var(--orange)}.gestion{background:var(--green)}.direction{background:var(--yellow);color:#17324f}
.top{position:sticky;top:0;z-index:10;background:linear-gradient(90deg,#073b76,#0d5da9);color:#fff;padding:7px;border-radius:12px;display:flex;gap:5px;overflow:auto}.top button{border:0;background:transparent;color:#dcecff;padding:7px;border-radius:8px;font-size:9px;font-weight:800;white-space:nowrap}.top button.on{background:#176fd1;color:#fff}
.btn{border:0;border-radius:9px;padding:8px 10px;font-weight:900}.green{background:#11a85f;color:#fff}.blue{background:#176fd1;color:#fff}.light{background:#eef4f9;color:#315a80}.red{background:#ef4444;color:#fff}
.pagehead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:14px;margin:8px 0 10px;background:#fff;border:1px solid var(--line);border-radius:14px}.pagehead .eyebrow{font-size:11px;font-weight:900;color:#1759a3;text-transform:uppercase;letter-spacing:.04em}.pagehead h2{margin:4px 0 0;font-size:22px;color:#153a66}.pagehead .subtxt{font-size:11px;color:#6a7f91;margin-top:5px}.head-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:9px}.head{display:flex;justify-content:space-between;gap:8px;align-items:center}.head h2{margin:0;font-size:17px}.small{font-size:10px;color:#6e8194}
.list{display:flex;flex-direction:column;gap:7px}.row{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}.num{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#e4efff;color:#0c5eb5;font-weight:900}
.status{border:0;border-radius:8px;padding:7px;font-size:9px;font-weight:900}.stwait{background:#eef3f7;color:#657789}.mounted{background:#11a85f;color:#fff}.absent{background:#ef4444;color:#fff}.done{background:#176fd1;color:#fff}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px}.check{border:1px solid var(--line);border-radius:9px;padding:9px}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:7px}.kpi b{font-size:20px}.kpi span{display:block;font-size:9px;color:#6e8194}
.notice{background:#fff9e8;border:1px solid #f3df9d;border-radius:12px;padding:10px 12px;font-size:10px;color:#805a00;margin:8px 0}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:7px}.field input{padding:9px;border:1px solid var(--line);border-radius:8px}
.master-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}.master{border-collapse:collapse;min-width:1500px;width:100%;font-size:10px}.master th{position:sticky;top:0;background:#eaf2fa;color:#173b63;text-align:left;padding:9px;border-bottom:1px solid var(--line);white-space:nowrap}.master td{padding:8px;border-bottom:1px solid #edf2f6;vertical-align:top}.master .pending-cell{background:#fff4dc}.master .action button{border:0;background:#176fd1;color:#fff;border-radius:8px;padding:6px 8px;font-size:9px;font-weight:800}.table-note{font-size:10px;color:#5f7487;margin:0 0 8px}.table-note b{color:#0a7440}
.editgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.editgrid label{font-size:9px;font-weight:800;color:#526b82}.editgrid input,.editgrid select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff}.edit-actions{display:flex;gap:7px;margin-top:9px}
.route-editor{display:flex;flex-direction:column;gap:8px}.route-row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px}.route-tools{display:flex;gap:6px}.route-tools button{border:0;background:#eef4f9;color:#1b4f85;border-radius:8px;padding:7px 9px;font-weight:900}.route-map{display:grid;grid-template-columns:1.1fr .9fr;gap:10px}.mapbox{background:linear-gradient(135deg,#eef7ff,#f7fbff);border:1px dashed #aac7e7;border-radius:14px;padding:10px;min-height:188px}.mini-road{position:relative;height:150px;border-radius:12px;background:linear-gradient(180deg,#f0f6fc,#fcfeff);overflow:hidden}.mini-road svg{position:absolute;inset:0;width:100%;height:100%}.legend{font-size:10px;color:#63788a;margin-top:7px}
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status-card{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.status-card b{display:block;font-size:22px;color:#153a66}.status-card span{font-size:10px;color:#6c8092}
.driver-quality{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quality-list{display:flex;flex-direction:column;gap:8px}.quality-item{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);padding:10px;border-radius:10px;background:#fff}.quality-item .controls{display:flex;gap:6px}.quality-item button{border:0;padding:5px 8px;border-radius:7px;background:#eef4f9;color:#204f80;font-weight:900}
.parent-flow{display:flex;flex-direction:column;gap:10px}.parent-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.parent-row .badge{min-width:150px;text-align:center;padding:10px 16px;font-size:12px;font-weight:950;border-radius:12px}.driver-map-note{font-size:10px;color:#6b7f92;margin-top:8px}.next-stop{border:2px solid #ffd23f;background:#fffdf0;box-shadow:0 0 0 3px rgba(255,210,63,.18);animation:nextPulse 1.1s ease-in-out infinite}.next-label{display:inline-block;margin-top:4px;background:#ffd84a;color:#17324f;padding:4px 8px;border-radius:99px;font-size:9px;font-weight:950}.done-row{background:#edf9f1}.route-progress{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}.route-progress b{color:#153a66}.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.report-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.report-card h3{margin:0 0 6px;font-size:14px;color:#153a66}.report-card .smallline{font-size:10px;color:#667b8d;padding:4px 0;border-bottom:1px solid #eef2f5}.report-card .smallline:last-child{border-bottom:0}.empty-note{font-size:10px;color:#6a7f91}.param-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.param-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}@keyframes nextPulse{0%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,210,63,.22)}50%{transform:scale(1.01);box-shadow:0 0 0 4px rgba(255,210,63,.16)}100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,210,63,.22)}}
.hero:before,.hero:after{content:"";position:absolute;z-index:2;pointer-events:none;border-radius:50%;left:73%;top:58%;opacity:0;transform:translate(-50%,-50%) scale(.2);border:2px solid rgba(255,255,255,.62);box-shadow:0 0 0 9px rgba(18,61,120,.07)}.hero:after{width:118px;height:118px;border-color:rgba(255,210,63,.42)}.hero:before{width:74px;height:74px}.hero.wave:before{animation:ripple 1.12s ease-out}.hero.wave:after{animation:ripple 1.28s ease-out .12s}.hero.wave img{animation:photoWave 1.15s ease-out}.welcome.wave h1{animation:titleWave .78s ease-out}.flag.wave i{animation:flagReveal .75s ease-out both}.flag.wave .y{animation-delay:.08s}.flag.wave .bb{animation-delay:.16s}
@keyframes ripple{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}18%{opacity:.78}100%{opacity:0;transform:translate(-50%,-50%) scale(2.25)}}@keyframes photoWave{0%{transform:scale(1)}45%{transform:scale(1.014)}100%{transform:scale(1)}}@keyframes titleWave{0%{opacity:.72;transform:translateY(4px) scale(.99)}55%{opacity:1;transform:translateY(0) scale(1.01)}100%{transform:none}}@keyframes flagReveal{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes roleIn{to{opacity:1;transform:none}}@keyframes tapPulse{0%{transform:scale(1)}50%{transform:scale(.965)}100%{transform:scale(1)}}

@media(min-width:700px){.roles{grid-template-columns:repeat(3,1fr)}.kpis{grid-template-columns:repeat(4,1fr)}}
@media(max-width:650px){.pagehead{flex-direction:column}.pagehead h2{font-size:18px}.head-actions{width:100%;justify-content:flex-start}.route-map,.status-grid,.driver-quality,.editgrid{grid-template-columns:1fr}.master{font-size:9px}}

/* V1.17 — GRAND TITRE D'ESPACE + DECONNEXION FONCTIONNELLE */
.space-titlebar{
  margin:0 0 7px;
  min-height:48px;
  background:linear-gradient(90deg,#083d78,#0b5ca8);
  color:#fff;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:8px 10px 8px 14px;
  box-shadow:0 5px 16px rgba(8,61,120,.16)
}
.space-title-left{min-width:0}
.space-title-kicker{
  font-size:9px;
  font-weight:900;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:#bbd8f7;
  margin-bottom:2px
}
.space-title-text{
  font-size:17px;
  line-height:1.1;
  font-weight:950;
  color:#fff;
  white-space:normal
}
.space-logout{
  border:0;
  background:#ef4444;
  color:#fff;
  border-radius:9px;
  padding:8px 11px;
  font-size:10px;
  font-weight:950;
  white-space:nowrap;
  box-shadow:0 3px 9px rgba(120,20,20,.18)
}
.space-logout:active{transform:scale(.97)}
.top{
  margin-top:0;
  border-radius:10px;
}
.context-note{
  background:#fff;
  border:1px solid var(--line);
  border-radius:11px;
  padding:9px 11px;
  margin:8px 0 10px;
  font-size:10px;
  color:#63788b
}
@media(max-width:650px){
  .space-titlebar{min-height:44px;padding:7px 8px 7px 11px}
  .space-title-kicker{font-size:8px}
  .space-title-text{font-size:14px}
  .space-logout{font-size:9px;padding:7px 9px}
  .parent-row .badge{min-width:128px;font-size:11px;padding:9px 12px}
  .report-grid,.param-grid{grid-template-columns:1fr}
}


/* V1.19 — ORDRE ECOLES, RETOUR INVERSE, SUIVI LIVE, VRAIE DECONNEXION SIMULEE */
.space-actions{display:flex;gap:7px;align-items:center}
.space-home{
  border:1px solid rgba(255,255,255,.55);background:#fff;color:#0d4d8d;
  border-radius:9px;padding:8px 11px;font-size:10px;font-weight:950;white-space:nowrap
}
.school-editor{display:flex;flex-direction:column;gap:8px}
.school-row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;
  border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px}
.school-row.next-school{border:2px solid #ffd23f;background:#fffdf0;animation:nextPulse 1.1s ease-in-out infinite}
.route-section-title{font-size:13px;font-weight:950;color:#153a66;margin:5px 0 8px}
.route-section-sub{font-size:10px;color:#687d90;margin-bottom:8px}
.live-list{display:flex;flex-direction:column;gap:8px}
.live-row{display:grid;grid-template-columns:38px minmax(0,1fr) 150px;gap:10px;align-items:center;
  border:1px solid var(--line);border-radius:11px;padding:9px;background:#fff}
.live-row.next-live{border:2px solid #ffd23f;background:#fffdf0}
.live-status{min-width:135px;text-align:center;padding:9px 11px!important;font-size:11px!important}
.absent-row{opacity:.68;background:#fff5f5}
.logout-screen{
  min-height:100vh;max-width:none!important;display:none;place-items:center;padding:20px;background:#eef4fb
}
.logout-screen.active{display:grid}
.logout-card{width:min(430px,92vw);background:#fff;border:1px solid var(--line);border-radius:18px;
  padding:28px;text-align:center;box-shadow:0 16px 50px rgba(20,55,90,.12)}
.logout-card h2{margin:0 0 7px;color:#153a66}.logout-card p{font-size:12px;color:#6a7f91}
.criteria{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.criteria .quality-item strong{color:#153a66}
@media(max-width:650px){
  .space-actions{width:100%;justify-content:flex-end}
  .space-home,.space-logout{font-size:9px;padding:7px 9px}
  .live-row{grid-template-columns:32px minmax(0,1fr) 112px}
  .live-status{min-width:105px;font-size:10px!important;padding:8px!important}
}


/* V1.20 — CARTOGRAPHIE REELLE DE REFERENCE + SIMULATION FINALE */
.map-reference{
  position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;
  overflow:hidden;margin-top:10px
}
.map-reference img{display:block;width:100%;height:auto}
.map-caption{padding:8px 10px;font-size:10px;color:#62798d;border-top:1px solid var(--line);background:#fff}
.map-overlay{position:absolute;inset:0;pointer-events:none}
.map-person{
  position:absolute;transform:translate(-50%,-50%);background:#fff;color:#123d78;
  border:2px solid #176fd1;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:950;
  box-shadow:0 4px 10px rgba(20,60,100,.18);white-space:nowrap
}
.map-person.done{border-color:#17a663;color:#0b7b46;background:#ecfaf2}
.map-person.absent{border-color:#ef4444;color:#a52222;background:#fff1f1}
.map-person.next{border-color:#ffd23f;color:#765800;background:#fffbe6;animation:nextPulse 1.1s infinite}
.map-bus{
  position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;background:#123d78;color:#fff;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.22)
}
.map-tools{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
.map-tools .btn{font-size:10px}
.map-approx{background:#eef8ff;color:#155d99;border:1px solid #cfe4f6}
.map-warning{font-size:9px;color:#7a6500;background:#fff9db;border:1px solid #f1dd8e;padding:7px 9px;border-radius:9px;margin-top:7px}
.return-school-list{display:flex;flex-direction:column;gap:8px}
.return-school-row{display:grid;grid-template-columns:38px minmax(0,1fr) 90px;gap:8px;align-items:center;
  padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff}
.return-school-row.next-stop{border:2px solid #ffd23f}
.message-note{font-size:10px;color:#5e7488;background:#f5f9fd;border:1px solid #dce9f5;padding:9px 10px;border-radius:10px;margin-bottom:9px}
.readonly-chip{display:inline-block;background:#e9f1fb;color:#164f87;border-radius:99px;padding:4px 8px;font-size:9px;font-weight:900}
.badge-option{background:#eef3f8;color:#4e6478;border:1px solid #d7e1eb;border-radius:9px;padding:8px 10px;font-size:10px;margin:8px 0}
.loc-cell{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.loc-chip{display:inline-block;padding:3px 6px;border-radius:99px;background:#eef8ff;color:#155d99;font-size:8px;font-weight:900}
.route-mode{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.route-mode .card{margin:0}
@media(max-width:650px){
  .route-mode{grid-template-columns:1fr}
  .map-person{font-size:8px;padding:4px 6px}
  .map-bus{width:26px;height:26px;font-size:12px}
}


/* V1.20.1 — SUIVI PARENTS INSPIRE DES BONNES PRATIQUES DE TRACKING */
.map-bus{
  width:21px!important;height:21px!important;font-size:8px!important;
  letter-spacing:-.02em;border:2px solid #fff;
  box-shadow:0 3px 10px rgba(0,0,0,.28),0 0 0 3px rgba(18,61,120,.10)
}
.active-leg{
  stroke:#ffd23f;stroke-width:1.7;stroke-linecap:round;fill:none;
  filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px #ffd23f);
  stroke-dasharray:3 2;animation:routeGlow 1.05s linear infinite
}
.active-leg-under{
  stroke:#0b5ca8;stroke-width:3.4;stroke-linecap:round;fill:none;opacity:.78
}
@keyframes routeGlow{to{stroke-dashoffset:-10}}
.parent-track-card{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0
}
.parent-track-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.parent-track-title{font-size:14px;font-weight:950;color:#153a66}
.parent-track-state{font-size:10px;color:#61778b;margin-top:3px}
.parent-track-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.parent-track-box{border:1px solid #e2eaf2;background:#f8fbfe;border-radius:10px;padding:9px}
.parent-track-box b{display:block;color:#153a66;font-size:12px}
.parent-track-box span{display:block;color:#6a7f91;font-size:9px;margin-top:2px}
.tracking-disclaimer{
  font-size:9px;color:#6c7f90;background:#f3f7fb;border-radius:9px;padding:7px 9px;margin-top:8px
}
.approach-pill{
  display:inline-block;background:#fff6c8;color:#735500;border:1px solid #eed15b;
  border-radius:999px;padding:5px 8px;font-size:9px;font-weight:950
}
@media(max-width:650px){
  .parent-track-grid{grid-template-columns:1fr}
}


/* V1.20.2 — DIRECTION / RECETTES MENSUELLES */
.dir-monthbar{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0 10px
}
.dir-monthbar b{color:#153a66}.dir-monthbar span{font-size:10px;color:#667b8d}
.dir-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:9px 0}
.dir-kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;min-height:88px}
.dir-kpi .v{font-size:22px;font-weight:950;color:#153a66}.dir-kpi .l{font-size:10px;color:#6c8092;margin-top:4px}
.dir-kpi.greenish{background:#effaf4}.dir-kpi.blueish{background:#eef6ff}.dir-kpi.redish{background:#fff1f1}.dir-kpi.yellowish{background:#fff7dc}
.dir-grid{display:grid;grid-template-columns:1fr 1.15fr;gap:10px}
.dir-panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}
.dir-panel h3{margin:0 0 10px;color:#153a66;font-size:14px}
.donut-wrap{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center}

function uniqueSchools(){
  var seen={}, out=[];
  st.subs.forEach(function(x){if(x.school&&!seen[x.school]){seen[x.school]=1;out.push(x.school)}});
  return out
}
function syncSchoolOrder(){
  var available=uniqueSchools();
  var preferred=["Quaben","Madonne","Bessieux","Britannia militaire de Libreville"];
  var proposed=preferred.filter(function(s){return available.indexOf(s)>=0});
  available.forEach(function(s){if(proposed.indexOf(s)<0)proposed.push(s)});
  if(!Array.isArray(st.schoolOrder)||!st.schoolOrder.length)st.schoolOrder=proposed.slice();
  else{
    st.schoolOrder=st.schoolOrder.filter(function(s){return available.indexOf(s)>=0});
    proposed.forEach(function(s){if(st.schoolOrder.indexOf(s)<0)st.schoolOrder.push(s)});
  }
  save()
}
function orderedSchools(activeOnly){
  syncSchoolOrder();
  if(!activeOnly)return st.schoolOrder.slice();
  var mountedSchools={};
  st.subs.forEach(function(x){if(x.ride==='Monté')mountedSchools[x.school]=1});
  return st.schoolOrder.filter(function(s){return mountedSchools[s]})
}
function nextSchoolIndex(){
  var schools=orderedSchools(true);
  for(var i=0;i<schools.length;i++){if(!st.schools[schools[i]])return i}
  return -1
}
function schoolOrderEditor(){
  syncSchoolOrder();
  return '<div class="route-section-title">2. Ordre des établissements</div><div class="route-section-sub">L’administration choisit l’ordre des écoles. Le chauffeur suit cet ordre sans le modifier.</div><div class="school-editor">'+
  st.schoolOrder.map(function(s,i){return '<div class="school-row"><div class="num">'+(i+1)+'</div><div><b>'+s+'</b><div class="small">'+st.subs.filter(function(x){return x.school===s}).length+' enfant(s)</div></div><div class="route-tools"><button '+(i===0?'disabled':'')+' onclick="moveSchoolIndex('+i+',-1)">↑</button><button '+(i===st.schoolOrder.length-1?'disabled':'')+' onclick="moveSchoolIndex('+i+',1)">↓</button></div></div>'}).join('')+'</div>'
}
function moveSchoolIndex(i,dir){
  syncSchoolOrder();
  var j=i+dir;
  if(i<0||j<0||i>=st.schoolOrder.length||j>=st.schoolOrder.length)return;
  var tmp=st.schoolOrder[i];st.schoolOrder[i]=st.schoolOrder[j];st.schoolOrder[j]=tmp;
  save();adminTab('circuit')
}
function liveStatus(x){
  if(x.ret==='Déposé retour')return ['Déposé(e)','ok'];
  if(x.ret==='Récupéré')return ['Retour maison','mounted'];
  if(st.schools[x.school])return ['Arrivé(e) école','done'];
  if(x.ride==='Absent')return ['Absent','bad'];
  if(x.ride==='Monté')return ['Monté(e)','ok'];
  return ['À prendre','wait']
}
function gestionLiveList(){
  var next=nextPickupIndex();
  return '<div class="live-list">'+st.subs.map(function(x,i){
    var s=liveStatus(x),extra=(i===next&&x.ride==='À prendre')?' next-live':'',abs=x.ride==='Absent'?' absent-row':'';
    return '<div class="live-row'+extra+abs+'"><div class="num">'+(i+1)+'</div><div><b>'+x.name+'</b><div class="small">'+x.pickup+' → '+x.school+'</div>'+(i===next&&x.ride==='À prendre'?'<span class="next-label">Prochain à récupérer</span>':'')+'</div><span class="badge live-status '+s[1]+'">'+s[0]+'</span></div>'
  }).join('')+'</div>'
}


var MAP_RAMASSAGE='';
var MAP_ECOLES='';
var PLACE_ORDER=["Premier Campement","Akanda","Avorbam","Première Cité","Okala","Alibandeng"];
var PLACE_POS={
  "Premier Campement":[12,12],
  "Akanda":[19,20],
  "Avorbam":[21,25],
  "Première Cité":[28,34],
  "Okala":[32,42],
  "Alibandeng":[39,66]
};
function simpleText(v){return String(v||"").replace(/[\/;|—–-]+/g," ").replace(/\s+/g," ").trim()}
function guessPlace(x){
  var t=(x.pickup+" "+x.address+" "+x.district+" "+x.commune).toLowerCase();
  if(t.indexOf("premier campement")>=0)return "Premier Campement";
  if(t.indexOf("avorobam")>=0||t.indexOf("avorbam")>=0)return "Avorbam";
  if(t.indexOf("première cité")>=0||t.indexOf("premiere cite")>=0||t.indexOf("1er cité")>=0||t.indexOf("1er cite")>=0)return "Première Cité";
  if(t.indexOf("okala")>=0)return "Okala";
  if(t.indexOf("aliband")>=0)return "Alibandeng";
  if(t.indexOf("akanda")>=0)return "Akanda";
  return "Akanda";
}

var APPROX_COORDS={
  "Premier Campement":[0.52838,9.36920],
  "Akanda":[0.51642,9.38822],
  "Avorbam":[0.50914,9.39036],
  "Première Cité":[0.49766,9.40239],
  "Okala":[0.48692,9.40942],
  "Alibandeng":[0.45590,9.42752]
};
function coordText(place){
  var c=APPROX_COORDS[place];
  return c?(c[0].toFixed(5)+", "+c[1].toFixed(5)):"Coordonnées à confirmer"
}

function approxChildIndex(i){
  if(i<0||i>=st.subs.length)return;
  var x=st.subs[i],p=guessPlace(x);
  x.approxPlace=p;x.mapApprox=true;x.approxCoord=APPROX_COORDS[p]||null;
  st.locationFeedback=x.name+" : position approximative proposée — "+p+" ≈ "+coordText(p)+". Référence croisée MapCarta + Google Maps déjà validée dans la simulation.";
  log(x.name+" : localisation approximative → "+p);save();adminTab('abonnes')
}
function approxAll(){
  st.subs.forEach(function(x){x.approxPlace=guessPlace(x);x.mapApprox=true;x.approxCoord=APPROX_COORDS[x.approxPlace]||null});
  st.locationFeedback="Localisation approximative calculée pour tous les abonnés à partir des références MapCarta + Google Maps déjà croisées.";
  log("Positions approximatives recalculées");save();adminTab('circuit')
}
function redefineRoute(){
  st.subs.forEach(function(x){x.approxPlace=x.approxPlace||guessPlace(x);x.mapApprox=true;x.approxCoord=APPROX_COORDS[x.approxPlace]||null});
  st.subs.sort(function(a,b){
    var ia=PLACE_ORDER.indexOf(a.approxPlace),ib=PLACE_ORDER.indexOf(b.approxPlace);
    return (ia<0?99:ia)-(ib<0?99:ib)
  });
  st.locationFeedback="Nouvelle proposition de ramassage générée selon l’ordre géographique approximatif : "+st.subs.map(function(x){return x.approxPlace}).join(" → ");
  log("Trajet de ramassage reproposé");save();adminTab('circuit')
}
function nextMapChild(){
  var i=nextPickupIndex();return i>=0?st.subs[i]:null
}

function handledPickupIndex(){
  var last=-1;
  for(var i=0;i<st.subs.length;i++){
    if(st.subs[i].ride==='Monté'||st.subs[i].ride==='Absent') last=i;
    else break;
  }
  return last
}
function activeLegSvg(){
  var next=nextMapChild(); if(!next)return '';
  var ni=st.subs.findIndex(function(x){return x.id===next.id});
  var li=handledPickupIndex();
  var startPlace=li>=0?(st.subs[li].approxPlace||guessPlace(st.subs[li])):"Akanda";
  var endPlace=next.approxPlace||guessPlace(next);
  var a=PLACE_POS[startPlace]||PLACE_POS["Akanda"], b=PLACE_POS[endPlace]||PLACE_POS["Akanda"];
  return '<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible">'+
    '<line class="active-leg-under" x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'"></line>'+
    '<line class="active-leg" x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'"></line>'+
  '</svg>'
}
function lastMovementText(){

  return st.log[st.log.length-1]
}
function lastChildMovementText(x){
  var ev=(st.events||[]).filter(function(e){return e.childId===x.id});
  return ev.length?ev[ev.length-1].text:'Aucun événement enregistré pour cet enfant';
}
function parentTrackingSummary(x){
  var next=nextMapChild(), state='Circuit en attente', target='—';
  if(x.noMorning&&!st.schools[x.school]&&x.ret==='À récupérer'){
    state='Matin : transport G10 non prévu';target=x.school||'Établissement';
  }else if(st.route){
    if(x.ret==='Déposé retour'){state='Enfant déposé(e)';target='Trajet terminé'}
    else if(x.ret==='Récupéré'){state='Retour en cours';target=x.drop||'Domicile / relais'}
    else if(st.schools[x.school]){state='Arrivé(e) à l’école';target=x.school}
    else if(x.ride==='Monté'){state='À bord du bus';target='Établissement scolaire'}
    else if(x.ride==='Absent'){state='Absent(e) au ramassage';target='Circuit poursuivi'}
    else {state='Ramassage en cours';target='Prochaine étape du circuit'}
  }
  var approach=(!x.noMorning&&next&&next.id===x.id&&x.ride==='À prendre')?'<span class="approach-pill">Bus en approche de votre enfant</span>':'';
  return '<div class="parent-track-card"><div class="parent-track-top"><div><div class="parent-track-title">Suivi du bus</div><div class="parent-track-state">'+state+'</div></div>'+approach+'</div>'+ 
    '<div class="parent-track-grid"><div class="parent-track-box"><b>'+target+'</b><span>Étape actuelle / destination déclarée</span></div>'+ 
    '<div class="parent-track-box"><b>'+lastChildMovementText(x)+'</b><span>Dernière mise à jour de votre enfant</span></div></div>'+ 
    '<div class="tracking-disclaimer">Suivi par étapes chauffeur, sans GPS embarqué. Aucun nom ni événement d’un autre élève n’est affiché dans ce profil.</div></div>'
}

function schoolExitTime(s){
  var times=st.subs.filter(function(x){return x.school===s&&(x.ride==='Monté'||x.noMorning)}).map(function(x){return x.exit||"23:59"});
  return times.length?times.sort()[0]:"23:59"
}
function returnSchoolOrder(){
  syncSchoolOrder();
  var relevant={};
  st.subs.forEach(function(x){if(x.ride==='Monté'||x.noMorning)relevant[x.school]=1});
  var base=st.schoolOrder.filter(function(s){return relevant[s]}),rev=base.slice().reverse();
  return base.slice().sort(function(a,b){
    var ta=schoolExitTime(a),tb=schoolExitTime(b);
    if(ta<tb)return -1;if(ta>tb)return 1;
    return rev.indexOf(a)-rev.indexOf(b)
  })
}

  syncReturnSchools();

}
function schoolIndex(i){var arr=orderedSchools(true);if(i<0||i>=arr.length)return;school(arr[i])}
function addSub(){var n=prompt('Nom de l’enfant'); if(!n)return; var e=prompt('École')||''; st.subs.push({id:String(Date.now()),name:n,school:e,guardian:'',district:'À compléter',pickup:'À compléter',drop:'À compléter',entry:'',exit:'',plan:'Standard',price:0,pending:3,payment:'À vérifier',ride:'À prendre',ret:'À récupérer'}); save();log('Nouvel abonné : '+n);adminTab('abonnes')}
function xpay(id,v){
  var x=st.subs.find(function(s){return s.id===id});if(!x)return;
  x.payment=v;
  if(v==='Payé'&&!x.paymentDate)x.paymentDate=new Date().toISOString().slice(0,10);
  save();log(x.name+' : paiement '+v);adminTab('paiements')
}
function adminTab(t){updateSpaceTitle('admin',t);var b=document.getElementById('adminBody'); if(t==='abonnes')b.innerHTML=sectionHeader('Administration','Liste des abonnés','Tableau maître corrigé avec les réponses de Martina.')+'<div class="card head"><div><h2>Tableau des abonnés — Zone Akanda</h2><div class="small">Ajouter, corriger ou valider les dossiers abonnés.</div></div><button class="btn green" onclick="addSub()">Ajouter un abonné</button></div>'+masterTable(); if(t==='paiements')b.innerHTML=sectionHeader('Administration','Paiements des abonnés','Validation mensuelle des montants et date de paiement.')+'<div class="list">'+st.subs.map(function(x){return '<div class="row"><div class="num">P</div><div><b>'+x.name+'</b><div class="small">'+money(x.price)+' • '+x.plan+'</div></div><div class="payment-date"><select onchange="xpay(\''+x.id+'\',this.value)"><option '+(x.payment==='À vérifier'?'selected':'')+'>À vérifier</option><option '+(x.payment==='Payé'?'selected':'')+'>Payé</option><option '+(x.payment==='Non payé'?'selected':'')+'>Non payé</option></select><input type="date" value="'+(x.paymentDate||'')+'" onchange="setPaymentDate(\''+x.id+'\',this.value)"></div></div>'}).join('')+'</div>'; if(t==='circuit')b.innerHTML=sectionHeader('Administration','Création du circuit','Déterminer l’ordre des enfants à ramasser avec le chauffeur.')+routeEditor(); if(t==='rapports')b.innerHTML=sectionHeader('Administration','Rapports','Journal de l’activité administrative et de la simulation.')+reportSummary()+logs(); if(t==='chauffeurs')b.innerHTML=sectionHeader('Administration','Chauffeurs','Nom, prénom, zone et plaque d’immatriculation.')+chauffeurAdminPanel()}
function gestionTab(t){updateSpaceTitle('gestion',t);var b=document.getElementById('gestionBody'); if(t==='suivi')b.innerHTML=sectionHeader('Gestion','Suivi quotidien','Vue d’exploitation en direct : qui a été pris, qui est absent, qui est arrivé à l’école et qui a été déposé au retour.')+'<div class="status-grid"><div class="status-card"><b>'+st.subs.length+'</b><span>Passagers prévus</span></div><div class="status-card"><b>'+st.subs.filter(function(x){return x.ride==='Monté'}).length+'</b><span>Monté(e)s</span></div><div class="status-card"><b>'+st.subs.filter(function(x){return x.ride==='Absent'}).length+'</b><span>Absents</span></div><div class="status-card"><b>'+doneCount()+'</b><span>Déposé(e)s retour</span></div></div><div class="route-map"><div class="card"><div class="tabs-title">Suivi live du chauffeur</div>'+gestionLiveList()+'</div><div class="card"><div class="tabs-title">Cartographie du circuit — progression déclarée</div>'+ramassageMapHtml('gestion')+'</div></div><button class="btn light" onclick="resetSim()">Reset simulation</button>'; else if(t==='rapports')b.innerHTML=sectionHeader('Gestion','Rapports','Journal opérationnel de la journée.')+logs(); else if(t==='abonnes')b.innerHTML=sectionHeader('Gestion','Abonnés','Liste des abonnés suivis aujourd’hui.')+list(); else if(t==='paiements')b.innerHTML=sectionHeader('Gestion','Paiements','Vue rapide des paiements par abonné.')+'<div class="list">'+st.subs.map(function(x){return '<div class="row"><div class="num">P</div><div><b>'+x.name+'</b><div class="small">'+money(x.price)+'</div></div><span class="badge '+badgeClass(x.payment)+'">'+x.payment+'</span></div>'}).join('')+'</div>'; else b.innerHTML=sectionHeader('Gestion','Circuit','Consultation de l’ordre défini par l’administration. La Gestion ne modifie pas le circuit.')+
  '<div class="card"><div class="route-section-title">Ordre enfants</div><div class="compact-order">'+
  st.subs.map(function(x,i){return '<div class="compact-order-line"><div class="compact-order-main">'+(i+1)+' - '+x.name+'</div><div class="compact-order-sub">'+x.pickup+'</div></div>'}).join('')+
  '</div><div class="route-section-title" style="margin-top:14px">Ordre établissements</div><div class="compact-order">'+
  orderedSchools(false).map(function(s,i){return '<div class="compact-order-line"><div class="compact-order-main">'+(i+1)+' - '+s+'</div></div>'}).join('')+
  '</div></div>'}
function directionTab(t){updateSpaceTitle('direction',t);var b=document.getElementById('directionBody');
  if(t==='dashboard')b.innerHTML=sectionHeader('Direction','Tableau de bord','Vue d’ensemble de la zone Akanda.')+directionDashboard();
  else if(t==='rapports')b.innerHTML=sectionHeader('Direction','Rapports','Historique des actions et incidents de la simulation.')+logs();
  else if(t==='bus')b.innerHTML=sectionHeader('Direction','Bus & chauffeur','Évaluation du chauffeur et qualité de service.')+driversPanel();
  else if(t==='paiements')b.innerHTML=sectionHeader('Direction','Paiements','Vision consolidée des paiements mensuels.')+'<div class="dir-monthbar"><b>'+billingMonthInfo().label+'</b><span>Échéance parents : le 5</span></div><div class="list">'+st.subs.map(function(x){return '<div class="row"><div class="num">P</div><div><b>'+x.name+'</b><div class="small">'+money(x.price)+' / mois</div></div><span class="badge '+badgeClass(x.payment)+'">'+x.payment+'</span></div>'}).join('')+'</div>';
  else b.innerHTML=sectionHeader('Direction','Abonnés','Liste synthétique des abonnés de la zone.')+list()
}
function profileChild(space){
  var key=space==='parent'?'parentProfileId':'studentProfileId';
  var id=st[key]||st.subs[0]?.id;
  return st.subs.find(function(x){return x.id===id})||st.subs[0]
}
function parentTab(t){updateSpaceTitle('parent',t);var b=document.getElementById('parentBody'),x=profileChild('parent');
  if(t==='enfant')b.innerHTML=sectionHeader('Espace parent','Mon enfant','Suivi du trajet en temps réel.')+parentView(x);
  if(t==='paiements')b.innerHTML=sectionHeader('Espace parent','Paiements','Montant, statut et date du paiement.')+'<div class="card"><h2>Paiement</h2><p>'+money(x.price)+' — <span class="badge '+badgeClass(x.payment)+'">'+x.payment+'</span></p><p class="small">Date de paiement : <b>'+displayDate(x.paymentDate)+'</b></p></div>';
  if(t==='messages')b.innerHTML=sectionHeader('Espace parent','Messages','Notifications concernant uniquement mon enfant.')+personalMessages(x)
}
function studentTab(t){updateSpaceTitle('student',t);var b=document.getElementById('studentBody'),x=profileChild('student');
  if(t==='trajet')b.innerHTML=sectionHeader('Espace élève','Mon trajet','Suivi simplifié de mon parcours.')+parentView(x);
  if(t==='ecole')b.innerHTML=sectionHeader('Espace élève','Mon école','Informations de mon établissement.')+'<div class="card"><h2>'+x.school+'</h2><div class="school-info-grid"><div class="school-info-box"><b>'+(x.entry||'À confirmer')+'</b><span>Début des cours</span></div><div class="school-info-box"><b>'+(x.exit||'À confirmer')+'</b><span>Fin des cours</span></div></div></div>';
  if(t==='messages')b.innerHTML=sectionHeader('Espace élève','Messages','Notifications concernant uniquement mon profil.')+personalMessages(x)
}
function parentView(x){
  var morningRow=x.noMorning
    ? '<div class="parent-row"><div>Ramassage matin</div><span class="badge ok">Non prévu — déposé par la famille</span></div>'
    : '<div class="parent-row"><div>Monté(e)</div><span class="badge '+(x.ride==='Monté'?'ok':x.ride==='Absent'?'bad':'wait')+'">'+x.ride+'</span></div>';
  var schoolRow=x.noMorning
    ? '<div class="parent-row"><div>Arrivée à l’école le matin</div><span class="badge ok">Prise en charge par la famille</span></div>'
    : '<div class="parent-row"><div>Arrivé à l’école</div><span class="badge '+(st.schools[x.school]?'ok':'wait')+'">'+(st.schools[x.school]?'Déposé(e)':'En attente')+'</span></div>';
  return '<div class="card"><h2>'+x.name+'</h2><p>'+x.school+'</p></div>'+parentTrackingSummary(x)+ramassageMapHtml('parent',x.id)+'<div class="parent-flow"><div class="parent-row"><div>Circuit</div><span class="badge '+(st.route?'ok':'wait')+'">'+(st.route?'Démarré':'En attente')+'</span></div>'+morningRow+schoolRow+'<div class="parent-row"><div>Retour vers la maison</div><span class="badge '+(x.ret==='Récupéré'||x.ret==='Déposé retour'?'ok':'wait')+'">'+(x.ret==='Déposé retour'?'Arrivé(e)':x.ret==='Récupéré'?'En route':'À récupérer')+'</span></div><div class="parent-row"><div>Déposé(e)</div><span class="badge '+(x.ret==='Déposé retour'?'ok':'wait')+'">'+(x.ret==='Déposé retour'?'Déposé(e)':'En attente')+'</span></div></div>'
}
function logs(){return '<div class="card">'+(st.log.length?st.log.slice().reverse():['Aucune action pour le moment.']).map(function(x){return '<div class="small" style="padding:7px;border-bottom:1px solid #eee">'+x+'</div>'}).join('')+'</div>'}
function resetSim(){st.route=false;st.checks={};st.schools={};st.log=[];st.events=[];st.driver.controls360=0;st.subs.forEach(function(x){x.ride=x.noMorning?'Non concerné matin':'À prendre';x.ret='À récupérer';x.payment=x.payment||'À vérifier';x.approxPlace=guessPlace(x);x.mapApprox=true});syncSchoolOrder();save();gestionTab('suivi')}
st.subs.forEach(function(x){if(!x.approxPlace)x.approxPlace=guessPlace(x);x.mapApprox=true});syncSchoolOrder();
setTimeout(playHome,120);
</script>
</body></html>
